name: CI

# Builds both the iOS and tvOS targets to catch breakage. Runs only on pull
# requests (a push to a PR branch already triggers this via "synchronize"), so
# routine pushes don't double-run — important for macOS Actions minutes, which
# bill at 10x. Docs-only changes are skipped, and SwiftPM artifacts are cached.

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            scheme: Ultrafin-iOS
            destination: "generic/platform=iOS Simulator"
          - platform: tvOS
            scheme: Ultrafin-tvOS
            destination: "generic/platform=tvOS Simulator"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache SwiftPM artifacts
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('project.yml') }}
          restore-keys: spm-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build ${{ matrix.platform }}
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project Ultrafin.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee build.log

      - name: Report build errors to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### ❌ ${{ matrix.platform }} build failed"
            echo ""
            echo '```'
            grep -E "error:|unable to type-check|cannot find|no exact matches|ambiguous" build.log | head -40 || echo "(no error lines captured)"
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md || true
