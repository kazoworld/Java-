name: CI

# Compiles both the iOS and tvOS targets on every push/PR so build breakage is
# caught immediately. No code signing or secrets required — these are
# simulator builds for validation only.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    # macos-15 ships Xcode 16, which can read the project format XcodeGen emits.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            scheme: Ultrafin-iOS
            destination: "generic/platform=iOS Simulator"
          - platform: tvOS
            scheme: Ultrafin-tvOS
            destination: "generic/platform=tvOS Simulator"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build ${{ matrix.platform }}
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project Ultrafin.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
