name: Ultrafin
options:
  bundleIdPrefix: com.ultrafin
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # <- set your Apple Developer Team ID
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# ---------------------------------------------------------------------------
# External Swift packages are OPT-IN.
#
# The app compiles and runs with zero external dependencies:
#   - Networking uses the self-contained `JellyfinClient`.
#   - The VLCKit fallback engine is gated behind `#if canImport(VLCKit)`, so the
#     player runs on the native AVFoundation path when VLCKit isn't linked.
#
# This keeps CI hermetic and fast. To enable the full hybrid player (and/or the
# official Jellyfin SDK), uncomment the `packages:` block below AND the matching
# `dependencies:` entries under each target, then re-run `xcodegen generate`.
# Confirm the VLCKit package coordinates for your Xcode version first — see
# README "Enabling the VLCKit fallback".
# ---------------------------------------------------------------------------
# packages:
#   JellyfinSDK:
#     url: https://github.com/jellyfin/jellyfin-sdk-swift
#     from: "0.4.0"
#   VLCKit:
#     url: https://code.videolan.org/videolan/VLCKit.git
#     from: "4.0.0a10"

targets:
  Ultrafin-iOS:
    type: application
    platform: iOS
    sources:
      - path: Ultrafin/Sources
      - path: Ultrafin/Resources
    info:
      path: Ultrafin/Resources/Info-iOS.plist
      properties:
        CFBundleDisplayName: Ultrafin
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true # self-hosted servers are frequently HTTP/LAN
        NSLocalNetworkUsageDescription: Ultrafin discovers Jellyfin servers on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ultrafin.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    # dependencies:        # opt-in — see the packages note above
    #   - package: JellyfinSDK
    #   - package: VLCKit

  Ultrafin-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Ultrafin/Sources
      - path: Ultrafin/Resources
    info:
      path: Ultrafin/Resources/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Ultrafin
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Ultrafin discovers Jellyfin servers on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ultrafin.app
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
    # dependencies:        # opt-in — see the packages note above
    #   - package: JellyfinSDK
    #   - package: VLCKit
