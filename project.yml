name: Ultrafin
options:
  bundleIdPrefix: com.ultrafin
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # <- set your Apple Developer Team ID
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  # VLCKit powers the hybrid player's fallback engine for codecs/containers that
  # AVFoundation can't decode natively (the "Swiftfin media processing" path).
  # This wrapper ships the VLCKit 3.x `VLCKit-all` xcframework (device +
  # simulator slices) as a unified `VLCKitSPM` module for iOS and tvOS, and
  # applies the required system linker settings automatically.
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    exactVersion: 3.6.0
  # The official Jellyfin Swift SDK remains an optional add-on for screens that
  # want to migrate off the self-contained client. Uncomment to enable.
  # JellyfinSDK:
  #   url: https://github.com/jellyfin/jellyfin-sdk-swift
  #   from: "0.4.0"

targets:
  Ultrafin-iOS:
    type: application
    platform: iOS
    sources:
      - path: Ultrafin/Sources
      - path: Ultrafin/Resources
    info:
      path: Ultrafin/Resources/Info-iOS.plist
      properties:
        CFBundleDisplayName: Ultrafin
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true # self-hosted servers are frequently HTTP/LAN
        NSLocalNetworkUsageDescription: Ultrafin discovers Jellyfin servers on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ultrafin.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: VLCKitSPM

  Ultrafin-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Ultrafin/Sources
      - path: Ultrafin/Resources
    info:
      path: Ultrafin/Resources/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Ultrafin
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Ultrafin discovers Jellyfin servers on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ultrafin.app
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
    dependencies:
      - package: VLCKitSPM
