name: Ultrafin
options:
  bundleIdPrefix: com.ultrafin
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # <- set your Apple Developer Team ID
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  # Official Jellyfin Swift SDK (the same SDK Swiftfin builds on).
  # The app ships with a self-contained networking layer, but the SDK is
  # wired in so screens can migrate onto the generated client incrementally.
  JellyfinSDK:
    url: https://github.com/jellyfin/jellyfin-sdk-swift
    from: "0.4.0"
  # VLCKit powers the fallback playback engine for codecs/containers that
  # AVFoundation cannot decode natively (the "Swiftfin media processing" path).
  # Provided as a binary xcframework via SPM.
  VLCKit:
    url: https://code.videolan.org/videolan/VLCKit.git
    from: "4.0.0a10"

targets:
  Ultrafin-iOS:
    type: application
    platform: iOS
    sources:
      - path: Ultrafin/Sources
      - path: Ultrafin/Resources
    info:
      path: Ultrafin/Resources/Info-iOS.plist
      properties:
        CFBundleDisplayName: Ultrafin
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true # self-hosted servers are frequently HTTP/LAN
        NSLocalNetworkUsageDescription: Ultrafin discovers Jellyfin servers on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ultrafin.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: JellyfinSDK
      - package: VLCKit

  Ultrafin-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Ultrafin/Sources
      - path: Ultrafin/Resources
    info:
      path: Ultrafin/Resources/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Ultrafin
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Ultrafin discovers Jellyfin servers on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ultrafin.app
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
    dependencies:
      - package: JellyfinSDK
      - package: VLCKit
